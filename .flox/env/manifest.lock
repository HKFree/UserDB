    "hook": {
      "on-activate": "socket_id=$(php -r 'echo substr(hash(\"sha256\", getenv(\"FLOX_ENV_CACHE\")), 0, 20);')\nexport USERDB_MARIADB_SOCKET=\"/tmp/userdb-mariadb-$(id -u)-$socket_id/mysql.sock\"\nif [ -z \"${USERDB_LIBREOFFICE:-}\" ]; then\n  if [ -d \"$FLOX_ENV/Applications/LibreOffice.app\" ]; then\n    export USERDB_LIBREOFFICE=\"$FLOX_ENV/Applications/LibreOffice.app/Contents/MacOS/soffice\"\n  else\n    export USERDB_LIBREOFFICE=\"$FLOX_ENV/bin/libreoffice\"\n  fi\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "mariadb": {
        "command": "exec bash \"$FLOX_ENV_PROJECT/scripts/userdb_mariadb.sh\""
      }
    }
