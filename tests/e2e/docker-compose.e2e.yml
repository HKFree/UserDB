# Doplněk k docker-compose.yml pro E2E: vlastní konfigurace a env, worker dosáhne na mock push službu na hostu
services:
  web:
    volumes:
      - ./tests/e2e/config.e2e.neon:/opt/userdb/app/config/config.local.neon:ro
    env_file:
      - path: tests/e2e/e2e.env # VAPID klíče vygenerované pro běh testu
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - USERDB_VAPID_SUBJECT=mailto:e2e@example.hkfree.org
      - DIGISIGN_ACCESS_KEY=x
      - DIGISIGN_SECRET_KEY=x
