name: Deploy to the testing server

on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: deploy-testing-${{ github.event.pull_request.number || 'master' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy or remove the instance over SSH
    # A pull request from a fork has no key, and its code must not run on the server unreviewed.
    # Dependabot runs get no secrets either.
    if: >-
      github.repository == 'HKFree/UserDB'
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTING_SSH_HOST: ${{ vars.TESTING_SSH_HOST }}
      TESTING_SSH_USER: ${{ vars.TESTING_SSH_USER }}
      TESTING_SSH_KNOWN_HOSTS: ${{ vars.TESTING_SSH_KNOWN_HOSTS }}
      TESTING_SSH_KEY: ${{ secrets.TESTING_SSH_KEY }}
      TESTING_DOMAIN: ${{ vars.TESTING_DOMAIN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The key is bound on the server to scripts/userdb_testing_deploy.sh, which accepts only these requests.
      - name: Run the request on the server
        run: |
          if [ -z "$PR_NUMBER" ]; then
            instance=master
            request="deploy master $GITHUB_SHA"
          elif [ "$PR_ACTION" = closed ]; then
            instance="pr-$PR_NUMBER"
            request="remove $instance"
          else
            instance="pr-$PR_NUMBER"
            request="deploy $instance $PR_HEAD_SHA"
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TESTING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$TESTING_SSH_KEY" > ~/.ssh/deploy_key)
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
            "$TESTING_SSH_USER@$TESTING_SSH_HOST" "$request"
          if [ "$PR_ACTION" != closed ]; then
            echo "Deployed to https://$instance.$TESTING_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          fi

  comment:
    name: Link the instance in the pull request
    needs: deploy
    # Runs after a failed deploy too, so that the comment never points to an instance that is not running.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job of its own: it may write to pull requests and holds no SSH key.
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TESTING_DOMAIN: ${{ vars.TESTING_DOMAIN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # One comment per pull request, found again by its first line and rewritten on every run.
      - name: Create or update the comment
        run: |
          marker='<!-- userdb-testing-instance -->'
          commit="${PR_HEAD_SHA:0:7}"
          if [ "$DEPLOY_RESULT" != success ] && [ "$PR_ACTION" = closed ]; then
            text="Zrušení testovací instance tohoto PR selhalo, instance mohla na serveru zůstat. [Log běhu]($RUN_URL)"
          elif [ "$DEPLOY_RESULT" != success ]; then
            text="Nasazení commitu \`$commit\` na testovací server selhalo, instance tohoto PR neběží. [Log běhu]($RUN_URL)"
          elif [ "$PR_ACTION" = closed ]; then
            text="Testovací instance tohoto PR je zrušená."
          else
            text="Testovací instance tohoto PR: https://pr-$PR_NUMBER.$TESTING_DOMAIN/

          Běží na ní commit \`$commit\`. Každý push do PR ji nasadí znovu a její databázi postaví znovu z demo dat. Ze sítě HKFree se otevře bez hesla, odjinud chce heslo, které mají správci."
          fi
          body="$marker
          $text"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          ids=$(gh api --paginate "$comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          elif [ "$PR_ACTION" != closed ]; then
            gh api --silent --method POST "$comments" -f body="$body"
          fi
