name: Deploy testing environment (userdb-test)

on:
  push:
    branches: ["testing"]
  pull_request:
    branches: ["testing"]

env:
  CLOUD_HOSTNAME: ${{ vars.CLOUD_HOSTNAME }}
  CLOUD_USERNAME: ${{ vars.CLOUD_USERNAME }}
  CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}

jobs:
  deploy_test:
    name: Deploy testing branch to the test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List repository files
        run: ls -la
      - name: Create ~/.ssh directory
        run: mkdir ~/.ssh
      - name: Store SSH key
        run: echo "$CLOUD_SSH_KEY" >> ~/.ssh/id_rsa
      - name: Set SSH key permissions
        run: chmod 0600 ~/.ssh/id_rsa
      - name: Run deploy-userdb-test.sh on the server over SSH
        run: ssh -o StrictHostKeyChecking=no $CLOUD_USERNAME@$CLOUD_HOSTNAME "./deploy-userdb-test.sh"
