name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history

      # Docker image instead of gitleaks-action (which requires a license for organizations); known findings are in .gitleaksignore
      - name: Scan git history for secrets
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact --verbose --gitleaks-ignore-path /repo/.gitleaksignore
