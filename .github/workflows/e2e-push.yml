name: E2E push notifikace

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["push-notifications"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurace
        run: |
          cp tests/e2e/config.e2e.neon app/config/config.local.neon
          printf 'DIGISIGN_ACCESS_KEY=x\nDIGISIGN_SECRET_KEY=x\n' > .local.env

      - name: Start aplikace (Apache + MariaDB 10.1 z docker-compose.yml)
        run: |
          $COMPOSE up -d --build web db
          $COMPOSE exec -T web composer install --no-interaction
          $COMPOSE exec -T web chmod -R 777 log temp
          # VAPID klíče jen pro tento běh
          $COMPOSE exec -T web php bin/console app:push_vapid_keys >> .local.env
          $COMPOSE up -d --force-recreate web
          for i in $(seq 1 30); do $COMPOSE exec -T web php bin/console migrations:continue && break; sleep 2; done
          curl -sf -o /dev/null -H 'UID: 1001' http://moje.localhost:10107/userdb/clen/ --resolve moje.localhost:10107:127.0.0.1

      - name: Unit testy
        run: $COMPOSE exec -T web vendor/bin/tester tests/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: E2E testy
        working-directory: tests/e2e
        env:
          E2E_WORKER_CMD: cd ../.. && $COMPOSE exec -T web php bin/console app:push_send
          E2E_PUSH_HOST: host.docker.internal
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logy při selhání
        if: failure()
        run: |
          $COMPOSE logs web
          cat log/*.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: tests/e2e/test-results
